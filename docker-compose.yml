# region Common Settings & Anchors
x-common-settings: &common-settings
  restart: "no"
  environment:
    - ENV=${ENV:-development}
  networks:
    - dev-stack-network
# endregion

services:
  # region Ollama
  ollama:
    <<: *common-settings
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
  # endregion

  # region Piper TTS
  ai-piper-tts:
    <<: *common-settings
    build:
      context: ./piper
      dockerfile: Dockerfile
    container_name: ai-piper-tts
    ports:
      - "${PIPER_PORT:-8000}:8000"
    volumes:
      - piper_models:/models
    deploy:
      resources:
        limits:
          memory: ${PIPER_MEMORY_LIMIT:-512M}
  # endregion

  # region Coqui XTTS v2
  ai-xtts-tts:
    <<: *common-settings
    image: ghcr.io/coqui-ai/tts-cpu:latest
    container_name: ai-xtts-tts
    ports:
      - "${XTTS_PORT:-8020}:8020"
    environment:
      - TTS_READ_TEXT_DIRECTLY=true
    volumes:
      - xtts_models:/root/.local/share/tts
    command: tts-server --model_name tts_models/multilingual/multi-dataset/xtts_v2 --port 8020
    deploy:
      resources:
        limits:
          memory: ${XTTS_MEMORY_LIMIT:-4G}
  # endregion

  # region Whisper STT
  ai-whisper-stt:
    <<: *common-settings
    build:
      context: ./whisper
      dockerfile: Dockerfile
    container_name: ai-whisper-stt
    ports:
      - "${WHISPER_PORT:-8001}:8000"
    environment:
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - CTRANS_NUM_THREADS=${CTRANS_NUM_THREADS:-2}
    volumes:
      - whisper_models:/root/.cache/huggingface
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: ${WHISPER_MEMORY_LIMIT:-1G}
  # endregion

# region Volumes
volumes:
  ollama_data:
  piper_models:
  xtts_models:
  whisper_models:
# endregion

# region Networks
networks:
  dev-stack-network:
    name: ${DOCKER_NETWORK_NAME:-dev-stack-network}
    external: true
# endregion