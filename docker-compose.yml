x-common-settings: &common-settings
  restart: unless-stopped
  environment:
    - ENV=${ENV:-development}
  networks:
    - dev-stack-network

services:
  # -----------------------------
  # OLLAMA
  # -----------------------------
  ollama:
    <<: *common-settings
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama

  # -----------------------------
  # PIPER TTS
  # -----------------------------
  ai-piper-tts:
    <<: *common-settings
    build:
      context: ./piper
      dockerfile: Dockerfile
    container_name: ai-piper-tts
    ports:
      - "${PIPER_PORT:-8000}:8000"
    volumes:
      - piper_models:/models
    deploy:
      resources:
        limits:
          memory: ${PIPER_MEMORY_LIMIT:-512M}

  # -----------------------------
  # WHISPER STT
  # -----------------------------
  ai-whisper-stt:
    <<: *common-settings
    build:
      context: ./whisper
      dockerfile: Dockerfile
    container_name: ai-whisper-stt
    ports:
      - "${WHISPER_PORT:-8001}:8000"
    environment:
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - CTRANS_NUM_THREADS=${CTRANS_NUM_THREADS:-2}
    volumes:
      - whisper_models:/root/.cache/huggingface
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: ${WHISPER_MEMORY_LIMIT:-1G}

volumes:
  ollama_data:
  piper_models:
  whisper_models:

networks:
  dev-stack-network:
    name: ${DOCKER_NETWORK_NAME:-dev-stack-network}
    external: true
